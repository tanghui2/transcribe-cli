name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q transcribe_cli

      - name: 单元测试
        run: python -m unittest discover tests -v

      - name: CLI 可用性检查
        run: python -m transcribe_cli --help

      - name: 参数解析检查
        run: |
          python -c "
          from transcribe_cli.__main__ import build_parser
          a = build_parser().parse_args(['x.mp4', '--language', 'zh', '--summarize'])
          assert a.language == 'zh' and a.summarize
          print('参数解析正常')
          "

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包（Linux 单文件）
        run: python build_exe.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-cli-linux
          path: dist/
          retention-days: 7
